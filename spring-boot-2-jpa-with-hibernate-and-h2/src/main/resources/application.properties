########## new application.properties from:https://medium.com/@tafseerrimpi/how-spring-boot-works-with-h2-hibernate-and-jdbc-explained-with-a-real-life-example-206df7d160e8

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
#Accessing the H2 Console -> the H2 console is enabled by default when you use Spring Boot Developer Tools (DevTools)
#spring.h2.console.enabled=true
# the data.sql script executes before Hibernate initialization. 
spring.jpa.defer-datasource-initialization=true


